version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=production-secret-key-change-in-prod
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
    restart: unless-stopped
