{% extends "admin/base_site.html" %}

{% block branding %}
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 10px;">
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.25rem;">
            <span style="background: linear-gradient(135deg, #3b82f6, #6366f1); padding: 4px 8px; border-radius: 6px; color: white;">Py</span>
            <span>PyMaster Administration</span>
        </a>
    </h1>

    <div style="display: flex; align-items: center; gap: 10px; margin-left: auto;">
        <a href="{% url 'admin_panel' %}" 
           style="background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);">
            <span>📊 Visual Analytics & Video Hub</span>
        </a>
        <a href="{% url 'home' %}" 
           target="_blank"
           style="background: #334155; color: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; text-decoration: none;">
            🌐 View Public Site
        </a>
    </div>
</div>
{% endblock %}
