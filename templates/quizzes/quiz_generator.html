{% extends 'base.html' %}

{% block title %}Random Quiz Generator | PyMaster{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="p-8 sm:p-10 rounded-3xl bg-slate-800/90 border border-slate-700/80 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl mx-auto border border-indigo-500/30">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Random Quiz Generator</h1>
            <p class="text-xs text-slate-400 max-w-md mx-auto">
                Customize your assessment criteria. We will randomly select questions and randomize answer choices for you.
            </p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- 1. Select Category -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-tags text-indigo-400 mr-1.5"></i> 1. Select Topic / Category
                </label>
                <select name="category" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="all">🌟 All Categories (Mixed Topics)</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 2. Select Difficulty -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-gauge text-amber-400 mr-1.5"></i> 2. Target Difficulty Level
                </label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <label class="p-3.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-emerald-500 cursor-pointer flex items-center justify-center gap-2 transition text-xs font-semibold text-slate-200 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10 has-[:checked]:text-emerald-400">
                        <input type="radio" name="difficulty" value="easy" class="hidden">
                        <span>🟢 Easy</span>
                    </label>
                    <label class="p-3.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-amber-500 cursor-pointer flex items-center justify-center gap-2 transition text-xs font-semibold text-slate-200 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 has-[:checked]:text-amber-400">
                        <input type="radio" name="difficulty" value="medium" class="hidden">
                        <span>🟡 Medium</span>
                    </label>
                    <label class="p-3.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-rose-500 cursor-pointer flex items-center justify-center gap-2 transition text-xs font-semibold text-slate-200 has-[:checked]:border-rose-500 has-[:checked]:bg-rose-500/10 has-[:checked]:text-rose-400">
                        <input type="radio" name="difficulty" value="hard" class="hidden">
                        <span>🔴 Hard</span>
                    </label>
                    <label class="p-3.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center gap-2 transition text-xs font-semibold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-500/10 has-[:checked]:text-indigo-400">
                        <input type="radio" name="difficulty" value="mixed" checked class="hidden">
                        <span>⚡ Mixed</span>
                    </label>
                </div>
            </div>

            <!-- 3. Number of Questions -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-list-ol text-blue-400 mr-1.5"></i> 3. Number of Questions
                </label>
                <div class="grid grid-cols-4 gap-3">
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="question_count" value="5" class="hidden">
                        <span>5 Questions</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="question_count" value="10" checked class="hidden">
                        <span>10 Questions</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="question_count" value="15" class="hidden">
                        <span>15 Questions</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="question_count" value="20" class="hidden">
                        <span>20 Questions</span>
                    </label>
                </div>
            </div>

            <!-- 4. Timer Configuration -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                    <i class="fa-solid fa-stopwatch text-rose-400 mr-1.5"></i> 4. Quiz Timer
                </label>
                <div class="grid grid-cols-4 gap-3">
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="time_limit" value="5" class="hidden">
                        <span>5 Minutes</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="time_limit" value="10" checked class="hidden">
                        <span>10 Minutes</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="time_limit" value="15" class="hidden">
                        <span>15 Minutes</span>
                    </label>
                    <label class="p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-indigo-500 cursor-pointer flex items-center justify-center transition text-xs font-bold text-slate-200 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="radio" name="time_limit" value="0" class="hidden">
                        <span>No Timer</span>
                    </label>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-700">
                <button type="submit" 
                        class="w-full py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-xl shadow-indigo-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-xs"></i>
                    <span>Generate & Launch Quiz Now</span>
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
