{% extends 'base.html' %}

{% block title %}Sign In | PyMaster{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full p-8 rounded-2xl bg-slate-800/80 border border-slate-700/80 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-brand-600 flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-brand-500/20">
                <i class="fa-brands fa-python text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">Welcome Back</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to track your streak, progress, and badges</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" required
                       class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 text-sm">
            </div>

            <button type="submit" 
                    class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20 transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Don't have an account yet? 
            <a href="{% url 'register' %}" class="text-brand-400 hover:text-brand-300 font-semibold">Create one for free</a>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-700/80 text-center text-[11px] text-slate-500">
            Demo credentials: <span class="font-mono text-slate-400">gowtham</span> / <span class="font-mono text-slate-400">python123</span>
        </div>
    </div>
</div>
{% endblock %}
